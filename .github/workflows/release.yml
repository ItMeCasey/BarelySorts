name: release

# Push a tag such as v2026.11.1 to build the layers whose mod_version equals the tag, combine them into one jar per Minecraft version, publish a GitHub
# prerelease and upload to CurseForge. Only the Minecraft versions whose modules carry the tag's version are combined and
# uploaded; the others keep their older release. At least one Minecraft version must match, or the run fails.
# A manual run only builds and attaches the jars to the run, unless "publish" is ticked.
# Needs the repository secret CURSEFORGE_TOKEN (a CurseForge upload API token).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release type
        type: choice
        options: [beta, alpha, release]
        default: beta
      publish:
        description: Upload to CurseForge (off builds and attaches the jars to the run only)
        type: boolean
        default: false
      dry_run:
        description: Check the CurseForge game version ids and print the upload plan, uploading nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    # Builds only the modules whose mod_version equals the tag (a manual run uses the newest CHANGELOG version).
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then release="${GITHUB_REF_NAME#v}"; else release=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //'); fi
          python3 .github/scripts/plan_matrix.py release --tag "$release"
      - name: Something must match the tag
        if: steps.plan.outputs.any != 'true'
        run: |
          echo "No module has mod_version equal to the tag, so there is nothing to release"
          exit 1

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            !${{ matrix.module }}/build/libs/*-sources.jar
            !${{ matrix.module }}/build/libs/*-dev.jar
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: layers

      - name: Check the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then release="${GITHUB_REF_NAME#v}"; else release=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //'); fi
          released=""
          for mc in 1.20.1 1.21.1 26.1.2 26.2 26.3; do
            versions=$(grep -h '^mod_version=' *-$mc/gradle.properties | sed 's/^mod_version=//' | sort -u)
            if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
              echo "Modules of $mc disagree on mod_version: $(echo $versions)"; exit 1
            fi
            if [ "$versions" = "$release" ]; then released="$released $mc"; else echo "skipping $mc: version $versions is not $release"; fi
          done
          if [ -z "$released" ]; then echo "No Minecraft version has mod_version $release, so there is nothing to release"; exit 1; fi
          echo "version=$release" >> "$GITHUB_OUTPUT"
          echo "released=$released" >> "$GITHUB_OUTPUT"

      - name: Combine the loader jars of each released Minecraft version
        run: |
          mkdir -p dist
          for mc in ${{ steps.version.outputs.released }}; do
            python3 scripts/combine_jars.py "dist/barelysorts-mc$mc-${{ steps.version.outputs.version }}.jar" layers/*-$mc/*.jar
          done
          ls -la dist

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          {
            echo "Minecraft versions in this release:${{ steps.version.outputs.released }}; each jar works on Forge, NeoForge and Fabric."
            echo
            echo "Changes:"
            if [ -n "$previous" ]; then git log --no-merges --pretty='format:- %s' "$previous..${GITHUB_SHA}"; else git log --no-merges -n 20 --pretty='format:- %s'; fi
            echo
          } > notes.md
          cat notes.md

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --title "BarelySorts ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --prerelease

      - name: CurseForge dry run (reads the live game version list, uploads nothing)
        if: inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --jars dist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}" \
            --dry-run

      - name: Upload to CurseForge
        if: (github.ref_type == 'tag' || inputs.publish) && !inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --jars dist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}"

      - name: Keep the jars with the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-jars
          path: dist/*.jar
