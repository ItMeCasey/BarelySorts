plugins {
    id 'java-library'
    id 'idea'
    id 'fabric-loom' version '1.9.2'
}

base {
    archivesName = "${mod_id}-fabric-mc${minecraft_version}"
}
version = mod_version
group = mod_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    main {
        java.srcDir '../version-1.20.1/src/main/java'
        java.srcDir '../common/src/main/java'
        if (project.hasProperty('tour')) { java.srcDir '../common/src/devtest/java'; java.srcDir '../version-1.20.1/src/devtest/java' }  // dev client tour, never in releases
        resources.srcDir '../version-1.20.1/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/barelysorts.accesswidener')
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property 'version', mod_version
    inputs.property 'minecraft', minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': mod_version, 'minecraft': minecraft_version, 'mod_name': mod_name,
               'mod_license': mod_license, 'mod_authors': mod_authors, 'mod_description': mod_description
    }
}
